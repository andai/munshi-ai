[project]
name = "andai-intake"
version = "0.0.0"
description = "munshi.ai andai-intake service (the notetaker mailbox: SMTP receiver and inbound store)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtpd==1.4.6",
    "andai-core",
    "authres==1.2.0",
    "dkimpy[arc]==1.1.8",
    "dnspython==2.9.0",
    "fastapi==0.162.0",
    "pyspf==2.0.14",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "andai_intake"
module-root = ""

[tool.uv.sources]
andai-core = { workspace = true }
