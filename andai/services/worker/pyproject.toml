[project]
name = "andai-worker"
version = "0.0.0"
description = "munshi.ai andai-worker service (canaries, join metrics, operator alerts)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "andai-core",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "prometheus-client==0.26.0",
]

[tool.uv.sources]
andai-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.11,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "andai_worker"
module-root = ""
