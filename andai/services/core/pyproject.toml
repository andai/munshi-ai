[project]
name = "andai-core"
version = "0.0.0"
description = "munshi.ai andai-core service (identity and tenancy)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.1",
    "cryptography==50.0.2",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "andai_core"
module-root = ""
