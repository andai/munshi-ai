[project]
name = "andai-core"
version = "0.0.0"
description = "munshi.ai andai-core service (Phase 1 skeleton: health endpoint only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "andai_core"
module-root = ""
