# andai overlay for Munshi's deploy/compose/docker-compose.yml.
#
# Never run this file on its own. It is merged on top of Munshi's file by andai/Makefile:
#
#   ANDAI_ROOT=<repo> docker compose -p andai-meet --project-directory <repo>/deploy/compose \
#     -f <repo>/deploy/compose/docker-compose.yml \
#     -f <repo>/andai/deploy/compose/docker-compose.andai.yml \
#     --env-file <repo>/.env ...        (template: <repo>/.env.example)
#
# What it does:
#   1. Adds the andai services (andai-core, andai-worker, andai-intake, andai-portal) and the
#      Mailpit mail catcher on Munshi's `munshi` network. andai-core keeps its data in its own
#      database `andai` on the stack's Postgres (never in Munshi's database).
#   2. For Munshi services it changes ONLY `environment` entries and `ports` (D-15 perimeter). No
#      Munshi file is edited; every other setting comes from the untracked .env.
#
# Images: every service runs a catalogue image ghcr.io/andai/munshi-<name>:${IMAGE_TAG}
# (andai/images.json, built by `make -C andai images`); `make -C andai images-check` enforces it.
#
# Ports: every published port binds to 127.0.0.1 (D-15). Munshi's own file already does this at
# v0.12.28; `ports: !override` (Compose >= 2.24) restates the bindings here so a future upstream
# change to 0.0.0.0 cannot widen the perimeter through a sync. Compose merges `ports` lists
# additively, so without `!override` an upstream binding would survive next to ours.
#
# Runner and model credentials (D-15, D-22, PLAT-02): agent-api and runtime get the OLLM values from
# .env — the completion port via MUNSHI_LLM_*, the claude-code harness via ANTHROPIC_BASE_URL /
# ANTHROPIC_AUTH_TOKEN / ANTHROPIC_MODEL (OLLM's Anthropic-compatible API). The Anthropic API key,
# the Claude subscription token and the credentials mount are forced EMPTY here as literals, so
# neither a deploy/compose/.env file (read by Munshi's `env_file`) nor the shell can hand them one.
# The runtime spawns agent workers from AGENT_WORKER_IMAGE (the hardened andai worker).
#
# Metrics (OPS-05, andai/docs/metrics.md): andai-core, andai-worker and andai-intake each serve
# GET /metrics on their port 8000. Prometheus scrapes them on the munshi network
# (andai-core:8000/metrics, andai-worker:8000/metrics, andai-intake:8000/metrics); no port is
# published for it beyond the 127.0.0.1 mappings below, and the portal never forwards /metrics.
#
# Monitoring (OPS-05, D-62, andai/docs/monitoring.md): COMPOSE_PROFILES=monitoring adds Prometheus,
# Alertmanager (its config rendered by alertmanager-config), a node exporter and Perses, all on
# 127.0.0.1 only. Every alert receiver is off until the operator turns one on. The
# `monitoring-test` profile adds a webhook sink and a fill-able test mount for the live alert run.
# No Grafana (AGPL-3.0). Third-party images are pinned by tag and digest (andai/images.json).

services:
  # ─── andai skeletons (health-only in Phase 1) ──────────────────────────────────────────────────
  andai-core:
    build:
      context: ${ANDAI_ROOT:?ANDAI_ROOT must be the repo root (andai/Makefile sets it)}/andai
      dockerfile: services/core/Dockerfile
    image: ghcr.io/andai/munshi-andai-core:${IMAGE_TAG:-dev}
    # Catalogue image (andai/images.json). Compose never pulls it: `make up` builds it when missing
    # (or pulls it with PULL=1), then starts with --no-build.
    pull_policy: never
    # andai-core's own database `andai` lives on the stack's Postgres, created by `make db-init`.
    # The service connects as the RLS-bound app role only; the owner URL is handed to the one-shot
    # migration container by `make db-migrate`, never to the running service. Passwords and the
    # KEK are hex/base64 values minted by gen-secrets.sh into the env file.
    environment:
      - ANDAI_VERSION=${ANDAI_VERSION:-dev}
      - ANDAI_ENV=${ANDAI_ENV:-dev}
      - ANDAI_DB_URL_APP=postgresql+psycopg://andai_app:${ANDAI_DB_PASSWORD_APP?ANDAI_DB_PASSWORD_APP must be in the env file (gen-secrets.sh mints it)}@postgres:5432/andai
      - ANDAI_KEK=${ANDAI_KEK?ANDAI_KEK must be in the env file (gen-secrets.sh mints it)}
      # Key rotation (andai/docs/runbooks/key-rotation.md): the previous KEKs, one base64 key per
      # line, in a file readable only by uid 10001 and mounted read-only; empty when none, e.g.
      #   volumes:
      #     - /etc/munshi/andai-kek-retired:/run/secrets/andai-kek-retired:ro
      # with ANDAI_KEK_RETIRED_FILE=/run/secrets/andai-kek-retired in the env file.
      - ANDAI_KEK_RETIRED_FILE=${ANDAI_KEK_RETIRED_FILE:-}
      - PLATFORM_ADMIN_URL=http://admin-api:8001
      - PLATFORM_ADMIN_TOKEN=${ADMIN_TOKEN}
      - ANDAI_ORG_MAX_CONCURRENT_BOTS=${ANDAI_ORG_MAX_CONCURRENT_BOTS:-3}
      # The platform gateway andai-core sends bots through, with each org's own key.
      - PLATFORM_GATEWAY_URL=http://gateway:8000
      - ANDAI_BOT_NAME=${ANDAI_BOT_NAME:-}
      - ANDAI_DEFAULT_LANGUAGE=${ANDAI_DEFAULT_LANGUAGE:-en}
      - ANDAI_LOBBY_TIMEOUT_S=${ANDAI_LOBBY_TIMEOUT_S:-600}
      - ANDAI_ALONE_TIMEOUT_S=${ANDAI_ALONE_TIMEOUT_S:-300}
      - ANDAI_DISCLOSURE_TEXT=${ANDAI_DISCLOSURE_TEXT:-}
      - ANDAI_PRIVACY_NOTICE_URL=${ANDAI_PRIVACY_NOTICE_URL:-}
      - ANDAI_RECONCILER=${ANDAI_RECONCILER:-on}
      # The language model minutes are written with (D-47): one OpenAI-compatible route inside the
      # perimeter; the base URL has no /v1. An empty base URL turns minutes off.
      - ANDAI_LLM_BASE_URL=${ANDAI_LLM_BASE_URL:-}
      - ANDAI_LLM_API_KEY=${ANDAI_LLM_API_KEY:-}
      - ANDAI_LLM_MODEL=${ANDAI_LLM_MODEL:-}
      - ANDAI_LLM_CONTEXT_TOKENS=${ANDAI_LLM_CONTEXT_TOKENS:-32000}
      - ANDAI_LLM_MAX_OUTPUT_TOKENS=${ANDAI_LLM_MAX_OUTPUT_TOKENS:-4000}
      - ANDAI_LLM_TIMEOUT_S=${ANDAI_LLM_TIMEOUT_S:-120}
      - ANDAI_LLM_PART_TOKENS=${ANDAI_LLM_PART_TOKENS:-5000}
      - ANDAI_DEFAULT_TIMEZONE=${ANDAI_DEFAULT_TIMEZONE:-Asia/Kolkata}
      # Data exports (OPS-02): days a ready bundle can be downloaded, the most its JSON part may
      # hold, and the processing note written into account.json (empty: the built-in note).
      - ANDAI_EXPORT_RETENTION_DAYS=${ANDAI_EXPORT_RETENTION_DAYS:-7}
      - ANDAI_EXPORT_MAX_BYTES=${ANDAI_EXPORT_MAX_BYTES:-67108864}
      - ANDAI_EXPORT_PROCESSING_NOTE=${ANDAI_EXPORT_PROCESSING_NOTE:-}
      # The secret meeting-api signs its system webhook with (POST /internal/platform-events);
      # meeting-api gets the same value below. gen-secrets.sh mints it.
      - ANDAI_PLATFORM_WEBHOOK_SECRET=${ANDAI_PLATFORM_WEBHOOK_SECRET?ANDAI_PLATFORM_WEBHOOK_SECRET must be in the env file (gen-secrets.sh mints it)}
      - REDIS_URL=redis://redis:6379/1
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-munshi.ai <no-reply@munshi.invalid>}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-false}
      - ANDAI_PORTAL_ORIGIN=${ANDAI_PORTAL_ORIGIN:-http://127.0.0.1:13100}
      # Comma-separated hostnames or CIDRs whose X-Forwarded-For is believed; hostnames are
      # resolved via DNS (30 s cache) and compared with the TCP peer address.
      - ANDAI_TRUSTED_PROXIES=${ANDAI_TRUSTED_PROXIES:-andai-portal}
    depends_on:
      postgres:
        condition: service_healthy
    ports: !override
      - "127.0.0.1:${ANDAI_CORE_PORT:-18300}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    networks: [munshi]
    restart: unless-stopped

  andai-worker:
    build:
      context: ${ANDAI_ROOT:?ANDAI_ROOT must be the repo root (andai/Makefile sets it)}/andai
      dockerfile: services/worker/Dockerfile
    image: ghcr.io/andai/munshi-andai-worker:${IMAGE_TAG:-dev}
    pull_policy: never
    # Canary joins, join metrics (/metrics) and operator alert mail (BOT-04, D-34). The worker runs
    # andai-core's own code with andai-core's settings: the RLS-bound app role (cross-org reads only
    # through andai_join_stats), the KEK (to unseal the canary org's platform key), the gateway, the
    # bot defaults canaries are sent with, and the SMTP relay.
    environment:
      - ANDAI_VERSION=${ANDAI_VERSION:-dev}
      - ANDAI_ENV=${ANDAI_ENV:-dev}
      - ANDAI_DB_URL_APP=postgresql+psycopg://andai_app:${ANDAI_DB_PASSWORD_APP?ANDAI_DB_PASSWORD_APP must be in the env file (gen-secrets.sh mints it)}@postgres:5432/andai
      - ANDAI_KEK=${ANDAI_KEK?ANDAI_KEK must be in the env file (gen-secrets.sh mints it)}
      # Key rotation (andai/docs/runbooks/key-rotation.md): the previous KEKs, one base64 key per
      # line, in a file readable only by uid 10001 and mounted read-only; empty when none, e.g.
      #   volumes:
      #     - /etc/munshi/andai-kek-retired:/run/secrets/andai-kek-retired:ro
      # with ANDAI_KEK_RETIRED_FILE=/run/secrets/andai-kek-retired in the env file.
      - ANDAI_KEK_RETIRED_FILE=${ANDAI_KEK_RETIRED_FILE:-}
      - PLATFORM_GATEWAY_URL=http://gateway:8000
      - ANDAI_BOT_NAME=${ANDAI_BOT_NAME:-}
      - ANDAI_DEFAULT_LANGUAGE=${ANDAI_DEFAULT_LANGUAGE:-en}
      - ANDAI_LOBBY_TIMEOUT_S=${ANDAI_LOBBY_TIMEOUT_S:-600}
      - ANDAI_ALONE_TIMEOUT_S=${ANDAI_ALONE_TIMEOUT_S:-300}
      - ANDAI_DISCLOSURE_TEXT=${ANDAI_DISCLOSURE_TEXT:-}
      - ANDAI_PRIVACY_NOTICE_URL=${ANDAI_PRIVACY_NOTICE_URL:-}
      - ANDAI_PORTAL_ORIGIN=${ANDAI_PORTAL_ORIGIN:-http://127.0.0.1:13100}
      # Standing test meetings that admit guests without a human (andai/docs/runbooks/canaries.md);
      # empty turns a platform's canary off. At most every 14400 s (4 h).
      - ANDAI_CANARY_MEET_URL=${ANDAI_CANARY_MEET_URL:-}
      - ANDAI_CANARY_TEAMS_URL=${ANDAI_CANARY_TEAMS_URL:-}
      - ANDAI_CANARY_ZOOM_URL=${ANDAI_CANARY_ZOOM_URL:-}
      - ANDAI_CANARY_INTERVAL_S=${ANDAI_CANARY_INTERVAL_S:-14400}
      # The operator address alert mail goes to; empty turns alert mail off.
      - ANDAI_ALERT_EMAIL=${ANDAI_ALERT_EMAIL:-}
      # Meetings scheduled from invites go this many seconds before they start (D-58), checked
      # every ANDAI_SCHEDULED_TICK_S seconds (at most 30).
      - ANDAI_INTAKE_JOIN_LEAD_S=${ANDAI_INTAKE_JOIN_LEAD_S:-120}
      - ANDAI_SCHEDULED_TICK_S=${ANDAI_SCHEDULED_TICK_S:-15}
      # The language model minutes are written with (D-47): one OpenAI-compatible route inside the
      # perimeter; the base URL has no /v1. An empty base URL turns minutes off.
      - ANDAI_LLM_BASE_URL=${ANDAI_LLM_BASE_URL:-}
      - ANDAI_LLM_API_KEY=${ANDAI_LLM_API_KEY:-}
      - ANDAI_LLM_MODEL=${ANDAI_LLM_MODEL:-}
      - ANDAI_LLM_CONTEXT_TOKENS=${ANDAI_LLM_CONTEXT_TOKENS:-32000}
      - ANDAI_LLM_MAX_OUTPUT_TOKENS=${ANDAI_LLM_MAX_OUTPUT_TOKENS:-4000}
      - ANDAI_LLM_TIMEOUT_S=${ANDAI_LLM_TIMEOUT_S:-120}
      - ANDAI_LLM_PART_TOKENS=${ANDAI_LLM_PART_TOKENS:-5000}
      - ANDAI_DEFAULT_TIMEZONE=${ANDAI_DEFAULT_TIMEZONE:-Asia/Kolkata}
      # Data exports (OPS-02): days a ready bundle can be downloaded, the most its JSON part may
      # hold, and the processing note written into account.json (empty: the built-in note).
      - ANDAI_EXPORT_RETENTION_DAYS=${ANDAI_EXPORT_RETENTION_DAYS:-7}
      - ANDAI_EXPORT_MAX_BYTES=${ANDAI_EXPORT_MAX_BYTES:-67108864}
      - ANDAI_EXPORT_PROCESSING_NOTE=${ANDAI_EXPORT_PROCESSING_NOTE:-}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-munshi.ai <no-reply@munshi.invalid>}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-false}
      # Monitoring (andai/docs/monitoring.md): with ANDAI_MONITORING=1 the alert mail above stands
      # down while alertmanager-config's state file (read-only volume below) names a receiver.
      - ANDAI_MONITORING=${ANDAI_MONITORING:-0}
      - ANDAI_ALERTING_STATE_FILE=/run/munshi-alerting/state.json
    volumes:
      - alerting-state:/run/munshi-alerting:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports: !override
      - "127.0.0.1:${ANDAI_WORKER_PORT:-18301}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    networks: [munshi]
    restart: unless-stopped

  # e2e only (COMPOSE_PROFILES=e2e): a deterministic OpenAI-compatible chat route for the minutes
  # pipeline's live tests (andai_core.testing.fake_llm), from the andai-core image, so no other
  # image is needed. Never started by the default stack; an e2e env file points
  # ANDAI_LLM_BASE_URL at http://fake-llm:8000. Not published on the host.
  fake-llm:
    image: ghcr.io/andai/munshi-andai-core:${IMAGE_TAG:-dev}
    pull_policy: never
    profiles: [e2e]
    command: ["python", "-m", "andai_core.testing.fake_llm", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    init: true
    networks: [munshi]
    restart: unless-stopped

  andai-intake:
    build:
      context: ${ANDAI_ROOT:?ANDAI_ROOT must be the repo root (andai/Makefile sets it)}/andai
      dockerfile: services/intake/Dockerfile
    image: ghcr.io/andai/munshi-andai-intake:${IMAGE_TAG:-dev}
    pull_policy: never
    # The notetaker mailbox (INV-01, D-4): an SMTP receiver that accepts mail for the notetaker
    # addresses only and stores each message in the andai database before answering 250. It
    # connects as the RLS-bound app role and writes inbound_mail only through the 0012 functions.
    # The SMTP port is published on 127.0.0.1 only: no public MX until the VM (D-54); captured mail
    # is replayed into it (python -m andai_intake.replay). Its processor turns verified members'
    # invites into scheduled meetings, written as the sender's org, and mails the sender a
    # plain-text confirmation.
    environment:
      - ANDAI_VERSION=${ANDAI_VERSION:-dev}
      - ANDAI_ENV=${ANDAI_ENV:-dev}
      - ANDAI_DB_URL_APP=postgresql+psycopg://andai_app:${ANDAI_DB_PASSWORD_APP?ANDAI_DB_PASSWORD_APP must be in the env file (gen-secrets.sh mints it)}@postgres:5432/andai
      - ANDAI_INTAKE_ADDRESSES=${ANDAI_INTAKE_ADDRESSES:-}
      - ANDAI_INTAKE_SMTP_BIND=0.0.0.0:2525
      - ANDAI_INTAKE_MAX_BYTES=${ANDAI_INTAKE_MAX_BYTES:-10485760}
      - ANDAI_INTAKE_RAW_RETENTION_DAYS=${ANDAI_INTAKE_RAW_RETENTION_DAYS:-7}
      - ANDAI_INTAKE_ROW_RETENTION_DAYS=${ANDAI_INTAKE_ROW_RETENTION_DAYS:-30}
      # Sender verification (D-56): SPF/DKIM/ARC/DMARC lookups are the intake's only egress and go
      # to this resolver (empty: the container's own). The ARC sealer allowlist ships empty.
      - ANDAI_INTAKE_DNS_RESOLVER=${ANDAI_INTAKE_DNS_RESOLVER:-}
      - ANDAI_INTAKE_DNS_TIMEOUT_S=${ANDAI_INTAKE_DNS_TIMEOUT_S:-3}
      - ANDAI_INTAKE_DNS_MAX_QUERIES=${ANDAI_INTAKE_DNS_MAX_QUERIES:-30}
      - ANDAI_INTAKE_ARC_SEALERS=${ANDAI_INTAKE_ARC_SEALERS:-}
      # Invite rate limits per hour (D-58), counted in the same Valkey as andai-core.
      - ANDAI_INTAKE_RATE_SENDER_PER_H=${ANDAI_INTAKE_RATE_SENDER_PER_H:-20}
      - ANDAI_INTAKE_RATE_ORG_PER_H=${ANDAI_INTAKE_RATE_ORG_PER_H:-200}
      - ANDAI_INTAKE_RATE_PEER_PER_H=${ANDAI_INTAKE_RATE_PEER_PER_H:-120}
      # Scheduling (D-58): how far ahead an invite's occurrences get scheduled meetings, the zone a
      # floating invite time is read in, and the language of meetings scheduled from mail.
      - ANDAI_INTAKE_HORIZON_DAYS=${ANDAI_INTAKE_HORIZON_DAYS:-14}
      - ANDAI_DEFAULT_TIMEZONE=${ANDAI_DEFAULT_TIMEZONE:-Asia/Kolkata}
      - ANDAI_DEFAULT_LANGUAGE=${ANDAI_DEFAULT_LANGUAGE:-en}
      # The confirmation says the bot joins this many seconds before the start (andai-worker).
      - ANDAI_INTAKE_JOIN_LEAD_S=${ANDAI_INTAKE_JOIN_LEAD_S:-120}
      - REDIS_URL=redis://redis:6379/1
      # Plain-text confirmations to the verified sender of each processed invite (INV-04), through
      # the same relay as andai-core (Mailpit in dev and e2e).
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-munshi.ai <no-reply@munshi.invalid>}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      andai-core:
        condition: service_healthy
    ports: !override
      - "127.0.0.1:${ANDAI_INTAKE_PORT:-18302}:8000"
      - "127.0.0.1:${ANDAI_INTAKE_SMTP_PORT:-18325}:2525"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    networks: [munshi]
    restart: unless-stopped

  # e2e only (COMPOSE_PROFILES=e2e): a stub DNS server (andai_intake.testing.fake_dns) that answers
  # the sender check's TXT/A lookups from a zone file inside this container, which the e2e suite
  # writes as it signs its synthetic invites (andai_intake.testing.sign, run here). It shares
  # andai-intake's network namespace and listens on 127.0.0.1:5353 only, so the e2e env file sets
  # ANDAI_INTAKE_DNS_RESOLVER=127.0.0.1:5353. Never started by the default stack; not published.
  fake-dns:
    image: ghcr.io/andai/munshi-andai-intake:${IMAGE_TAG:-dev}
    pull_policy: never
    profiles: [e2e]
    command: ["python", "-m", "andai_intake.testing.fake_dns", "--zone", "/tmp/fake-dns/zone.json", "--host", "127.0.0.1", "--port", "5353"]
    network_mode: "service:andai-intake"
    depends_on:
      andai-intake:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "andai_intake.testing.fake_dns", "--probe", "--host", "127.0.0.1", "--port", "5353"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    init: true
    restart: unless-stopped

  andai-portal:
    build:
      context: ${ANDAI_ROOT:?ANDAI_ROOT must be the repo root (andai/Makefile sets it)}/andai/portal
      dockerfile: Dockerfile
    image: ghcr.io/andai/munshi-andai-portal:${IMAGE_TAG:-dev}
    pull_policy: never
    environment:
      - ANDAI_VERSION=${ANDAI_VERSION:-dev}
    ports: !override
      - "127.0.0.1:${ANDAI_PORTAL_PORT:-13100}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    init: true
    networks: [munshi]
    restart: unless-stopped

  # Mail catcher for development and CI (D-30): andai-core's default SMTP relay. It accepts any
  # message on port 1025 inside the stack network (never published) and shows it in a web UI and
  # HTTP API on 127.0.0.1 only. A deployment with a real relay sets SMTP_* and ignores it.
  mailpit:
    image: axllent/mailpit:v1.32.0
    environment:
      - MP_MAX_MESSAGES=5000
      # No outbound calls from the perimeter (D-15): no release check against the internet.
      - MP_DISABLE_VERSION_CHECK=true
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [munshi]
    restart: unless-stopped

  # ─── monitoring (COMPOSE_PROFILES=monitoring; andai/docs/monitoring.md) ──────────────────────────
  # Prometheus scrapes the andai services and the node exporter and evaluates the munshi alert
  # rules (andai/deploy/monitoring/prometheus). UI and API on 127.0.0.1 only; 15 days of data.
  prometheus:
    image: prom/prometheus:v3.13.5@sha256:aafa9d694e6a883c02db516d9f6e5b84e14195f49a2a6456a4cca815edda72b9
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=:9090
    volumes:
      - ${ANDAI_ROOT:?ANDAI_ROOT must be the repo root (andai/Makefile sets it)}/andai/deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${ANDAI_ROOT:?ANDAI_ROOT must be the repo root (andai/Makefile sets it)}/andai/deploy/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [munshi]
    restart: unless-stopped

  # One-shot: renders Alertmanager's config from the operator's settings with andai-worker's code
  # (andai_worker/alerting_config.py), so receivers are turned on with env flags and secret files,
  # never by editing YAML. Every receiver is off by default. It writes alertmanager.yml (and, when
  # SMTP_PASSWORD is set, a 0600 password file owned by Alertmanager's uid 65534) to the
  # alertmanager-config volume, and the receivers state file andai-worker reads to the
  # alerting-state volume. Root only to hand the files to uid 65534; no network, read-only root.
  # Webhook URLs stay in ANDAI_ALERT_SECRETS_DIR (slack_webhook_url, teams_webhook_url): it only
  # checks that they exist.
  alertmanager-config:
    image: ghcr.io/andai/munshi-andai-worker:${IMAGE_TAG:-dev}
    pull_policy: never
    profiles: [monitoring]
    command: ["python", "-m", "andai_worker.alerting_config", "--out", "/etc/alertmanager/munshi/alertmanager.yml", "--secrets-dir", "/etc/alertmanager/secrets", "--templates-dir", "/etc/alertmanager/templates", "--state-file", "/run/munshi-alerting/state.json", "--owner", "65534:65534"]
    user: "0:0"
    environment:
      - ANDAI_ENV=${ANDAI_ENV:-dev}
      # Email: the operator address (empty: no email receiver) through the stack's relay.
      - ANDAI_ALERT_EMAIL=${ANDAI_ALERT_EMAIL:-}
      # Slack / Teams (Workflows): on only with the flag AND the URL file in ANDAI_ALERT_SECRETS_DIR.
      - ANDAI_ALERT_SLACK=${ANDAI_ALERT_SLACK:-0}
      - ANDAI_ALERT_TEAMS=${ANDAI_ALERT_TEAMS:-0}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-munshi.ai <no-reply@munshi.invalid>}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-false}
    volumes:
      - ${ANDAI_ALERT_SECRETS_DIR:-./secrets/alerting}:/etc/alertmanager/secrets:ro
      - alertmanager-config:/etc/alertmanager/munshi
      - alerting-state:/run/munshi-alerting
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    restart: "no"

  # Alertmanager: routes Prometheus' alerts to the receivers alertmanager-config enabled, with the
  # munshi templates only (alert name, service, severity, fixed summary). Single instance: the
  # cluster listener is off. UI and API on 127.0.0.1 only (silences: andai/docs/runbooks/alerts.md).
  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    profiles: [monitoring]
    command:
      - --config.file=/etc/alertmanager/munshi/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
      - --cluster.listen-address=
    depends_on:
      alertmanager-config:
        condition: service_completed_successfully
    volumes:
      - alertmanager-config:/etc/alertmanager/munshi:ro
      - ${ANDAI_ROOT:?ANDAI_ROOT must be the repo root (andai/Makefile sets it)}/andai/deploy/monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
      - ${ANDAI_ALERT_SECRETS_DIR:-./secrets/alerting}:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-19093}:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [munshi]
    restart: unless-stopped

  # Filesystem use for the storage alert (filesystem collector only). It sees its own root (the
  # disk holding Docker's data: images, Postgres and object-storage volumes) and the host's
  # filesystems read-only under /host (ANDAI_NODE_EXPORTER_HOST_ROOT, default /). Overlay is
  # reported so that its own root counts; container and kernel mounts are excluded. Not published.
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    profiles: [monitoring]
    command:
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$$
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|etc)($$|/)|^/host/(dev|proc|run|sys|snap|var/lib/docker/.+|var/lib/containers/storage/.+|var/lib/kubelet/.+)($$|/)
      - --web.listen-address=:9100
    volumes:
      - ${ANDAI_NODE_EXPORTER_HOST_ROOT:-/}:/host:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9100/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [munshi]
    restart: unless-stopped

  # Perses (Apache-2.0) with the dashboards as code (andai/deploy/monitoring/perses), reading the
  # stack's Prometheus through its datasource proxy. No sign-in; UI on 127.0.0.1 only. No telemetry
  # to turn off (perses/config.yaml).
  perses:
    image: persesdev/perses:v0.55.1@sha256:292605f009770f07aa17217e70f877fabbc74858d0af9054d395064e1c411c06
    profiles: [monitoring]
    command: ["--config=/etc/perses/munshi/config.yaml", "--log.level=warning"]
    depends_on:
      prometheus:
        condition: service_started
    volumes:
      - ${ANDAI_ROOT:?ANDAI_ROOT must be the repo root (andai/Makefile sets it)}/andai/deploy/monitoring/perses/config.yaml:/etc/perses/munshi/config.yaml:ro
      - ${ANDAI_ROOT:?ANDAI_ROOT must be the repo root (andai/Makefile sets it)}/andai/deploy/monitoring/perses/provisioning:/etc/perses/provisioning:ro
      - perses-data:/perses
    ports:
      - "127.0.0.1:${PERSES_PORT:-19080}:8080"
    networks: [munshi]
    restart: unless-stopped

  # monitoring-test only (COMPOSE_PROFILES=...,monitoring-test): a local stand-in for Slack and
  # Teams webhooks (andai_core.testing.alert_sink) for the live alert run; point the URL files at
  # http://alert-sink:8000/slack and /teams. Never a real webhook; not published.
  alert-sink:
    image: ghcr.io/andai/munshi-andai-core:${IMAGE_TAG:-dev}
    pull_policy: never
    profiles: [monitoring-test]
    command: ["python", "-m", "andai_core.testing.alert_sink", "--host", "0.0.0.0", "--port", "8000", "--out", "/tmp/alert-sink/captured.jsonl"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    init: true
    networks: [munshi]
    restart: unless-stopped

  # monitoring-test only: a second node exporter that reports nothing but a 64 MiB tmpfs at
  # /host/munshi-fill (inside the storage alert's default mount regex), so the live run can fill it
  # past 80%. It shares the `node-exporter` network alias, which Prometheus resolves by DNS.
  node-exporter-fill:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    profiles: [monitoring-test]
    command:
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.filesystem.mount-points-exclude=^/$$|^/(dev|proc|run|sys|etc)($$|/)
      - --web.listen-address=:9100
    tmpfs:
      - /host/munshi-fill:size=64m,mode=1777
    networks:
      munshi:
        aliases: [node-exporter]
    restart: unless-stopped

  # ─── Munshi services: environment and ports only ─────────────────────────────────────────────────
  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5458}:5432"

  storage:
    ports: !override
      - "127.0.0.1:${STORAGE_HOST_PORT:-18900}:9000"

  admin-api:
    environment:
      # Not read by admin-api at v0.12.28 (only mcp and transcription read MUNSHI_ENV); set so the
      # whole stack carries one posture and a future upstream read picks up `production`.
      - MUNSHI_ENV=${MUNSHI_ENV:-production}
    ports: !override
      - "127.0.0.1:${ADMIN_API_PORT:-18057}:8001"

  runtime:
    environment:
      # The runtime copies these into every spawned agent worker (docker_backend.py), so they are
      # set here rather than left to Munshi's `env_file: .env` (which points at deploy/compose/.env,
      # a file this deployment does not use).
      - MUNSHI_RUNNER=${MUNSHI_RUNNER:-}
      - MUNSHI_LLM_PROVIDER=${MUNSHI_LLM_PROVIDER:-}
      - MUNSHI_LLM_BASE_URL=${MUNSHI_LLM_BASE_URL:-}
      - MUNSHI_LLM_API_KEY=${MUNSHI_LLM_API_KEY:-}
      - MUNSHI_LLM_MODEL=${MUNSHI_LLM_MODEL:-}
      - MUNSHI_LLM_MAX_TOKENS=${MUNSHI_LLM_MAX_TOKENS:-}
      - MUNSHI_MODEL_ALLOWLIST=${MUNSHI_MODEL_ALLOWLIST:-}
      # claude-code harness → OLLM's Anthropic-compatible API (D-22); forwarded into every worker.
      - ANTHROPIC_BASE_URL=${ANDAI_AGENT_BASE_URL:?ANDAI_AGENT_BASE_URL must be the OLLM base URL}
      - ANTHROPIC_AUTH_TOKEN=${ANDAI_AGENT_AUTH_TOKEN:?ANDAI_AGENT_AUTH_TOKEN must be the OLLM key}
      - ANTHROPIC_MODEL=${ANDAI_AGENT_MODEL:?ANDAI_AGENT_MODEL must be an OLLM model id}
      - ANTHROPIC_DEFAULT_OPUS_MODEL=${ANDAI_AGENT_MODEL}
      - ANTHROPIC_DEFAULT_SONNET_MODEL=${ANDAI_AGENT_MODEL}
      - ANTHROPIC_DEFAULT_HAIKU_MODEL=${ANDAI_AGENT_MODEL}
      # The hardened andai worker image (D-22). worker_image_for() honours this override first.
      - AGENT_WORKER_IMAGE=${AGENT_WORKER_IMAGE:?AGENT_WORKER_IMAGE must name the andai agent-worker image}
      # Anthropic account / Claude subscription credentials: forced empty (D-15, D-22).
      - HOST_CLAUDE_CREDENTIALS=
      - CLAUDE_CODE_OAUTH_TOKEN=
      - ANTHROPIC_API_KEY=
    ports: !override
      - "127.0.0.1:${RUNTIME_API_PORT:-18090}:8090"

  agent-api:
    environment:
      # agent-api reads MUNSHI_LLM_PROVIDER / MUNSHI_LLM_MODEL / MUNSHI_MODEL_ALLOWLIST as settings and
      # forwards MUNSHI_LLM_BASE_URL / MUNSHI_LLM_API_KEY into every dispatch (MODEL_AUTH_ENV_ALLOWLIST).
      - MUNSHI_RUNNER=${MUNSHI_RUNNER:-}
      - MUNSHI_LLM_PROVIDER=${MUNSHI_LLM_PROVIDER:-}
      - MUNSHI_LLM_BASE_URL=${MUNSHI_LLM_BASE_URL:-}
      - MUNSHI_LLM_API_KEY=${MUNSHI_LLM_API_KEY:-}
      - MUNSHI_LLM_MODEL=${MUNSHI_LLM_MODEL:-}
      - MUNSHI_LLM_MAX_TOKENS=${MUNSHI_LLM_MAX_TOKENS:-}
      - MUNSHI_MODEL_ALLOWLIST=${MUNSHI_MODEL_ALLOWLIST:-}
      # claude-code harness → OLLM (D-22). agent-api stamps these into each dispatch (only when
      # non-empty), matching what the runtime forwards, so both paths carry the same OLLM values.
      - ANTHROPIC_BASE_URL=${ANDAI_AGENT_BASE_URL:?ANDAI_AGENT_BASE_URL must be the OLLM base URL}
      - ANTHROPIC_AUTH_TOKEN=${ANDAI_AGENT_AUTH_TOKEN:?ANDAI_AGENT_AUTH_TOKEN must be the OLLM key}
      - ANTHROPIC_MODEL=${ANDAI_AGENT_MODEL:?ANDAI_AGENT_MODEL must be an OLLM model id}
      - ANTHROPIC_DEFAULT_OPUS_MODEL=${ANDAI_AGENT_MODEL}
      - ANTHROPIC_DEFAULT_SONNET_MODEL=${ANDAI_AGENT_MODEL}
      - ANTHROPIC_DEFAULT_HAIKU_MODEL=${ANDAI_AGENT_MODEL}
      # Anthropic account / Claude subscription credentials: forced empty (D-15, D-22).
      - CLAUDE_CODE_OAUTH_TOKEN=
      - ANTHROPIC_API_KEY=
    ports: !override
      - "127.0.0.1:${AGENT_API_PORT:-18100}:8100"

  meeting-api:
    environment:
      # Not read by meeting-api at v0.12.28; see admin-api.
      - MUNSHI_ENV=${MUNSHI_ENV:-production}
      # The system webhook: meeting.completed (and bot.failed) to andai-core on the stack network,
      # signed with the shared secret. andai-core only records it and makes the meeting's
      # transcript copy due; andai-worker's claim loop produces the minutes either way.
      - MUNSHI_SYSTEM_WEBHOOK_URL=http://andai-core:8000/internal/platform-events
      - MUNSHI_SYSTEM_WEBHOOK_SECRET=${ANDAI_PLATFORM_WEBHOOK_SECRET?ANDAI_PLATFORM_WEBHOOK_SECRET must be in the env file (gen-secrets.sh mints it)}
      - MUNSHI_SYSTEM_WEBHOOK_ALLOW_PRIVATE_HTTP=true
    ports: !override
      - "127.0.0.1:${MEETING_API_PORT:-18080}:8080"

  gateway:
    ports: !override
      - "127.0.0.1:${API_GATEWAY_HOST_PORT:-18056}:8000"

  flows-api:
    ports: !override
      - "127.0.0.1:${FLOWS_API_HOST_PORT:-18200}:8200"

  mcp:
    ports: !override
      - "127.0.0.1:${MCP_HOST_PORT:-18010}:8010"

  terminal:
    ports: !override
      - "127.0.0.1:${TERMINAL_PORT:-13000}:3000"

  # Operator-only (D-15): runs under COMPOSE_PROFILES=dashboard, reachable on 127.0.0.1 only.
  dashboard:
    ports: !override
      - "127.0.0.1:${DASHBOARD_PORT:-13001}:3000"

# Monitoring data and the rendered Alertmanager config (`monitoring` profile). alerting-state is
# also mounted read-only into andai-worker; without the profile it stays empty.
volumes:
  prometheus-data:
  alertmanager-data:
  alertmanager-config:
  alerting-state:
  perses-data:
