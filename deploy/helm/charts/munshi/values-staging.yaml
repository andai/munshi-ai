# LKE (Akamai) staging overlay for the v0.12 control plane.
#
# Deployed into its OWN namespace (munshi-v012-staging) so the live 0.11 `munshi-platform` staging in
# `munshi-staging` is untouched. Secrets come from a pre-created Secret (see deploy/helm/README, never
# in this file); transcription reuses the funded staging tx-gateway across namespaces.
#
#   kubectl --context lke590708-ctx create namespace munshi-v012-staging
#   # create the munshi-v012-secrets Secret (ADMIN_API_TOKEN, INTERNAL_API_SECRET,
#   #   TRANSCRIPTION_SERVICE_TOKEN, MUNSHI_DISPATCH_SIGNING_KEY) from munshi-secrets (sops, in-memory)
#   # create the recordings bucket named under storage.s3 below, and the munshi-v012-s3 Secret
#   #   (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) holding a key pair scoped to it
#   helm --kube-context lke590708-ctx upgrade --install munshi deploy/helm/charts/munshi \
#     -n munshi-v012-staging -f deploy/helm/charts/munshi/values-staging.yaml --wait

global:
  imageTag: "0.12-staging"     # pinned immutable tag pushed to DockerHub (build-once)
  imagePullPolicy: Always
  # LKE node pools are tainted example.invalid/pool; staging workloads run on the `temp` pool (mirrors the
  # live 0.11 staging). Pin there + tolerate the taint, else pods stay Pending (no schedulable node).
  nodeSelector:
    example.invalid/pool: temp
  tolerations:
    - key: munshi.ai/pool
      operator: Equal
      value: temp
      effect: NoSchedule

# Credentials live in a pre-created Secret (sops-decrypted in-memory), not in values.
secrets:
  existingSecretName: "munshi-v012-secrets"

runtime:
  backend: "k8s"               # real cloud spawn path (SA + RBAC + kubectl)

# Modest single-replica footprint on the shared staging cluster (raise for load tests).
gateway:
  replicaCount: 1
adminApi:
  replicaCount: 1
meetingApi:
  replicaCount: 1
  # Reuse the funded staging transcription gateway (cross-namespace DNS). Token is in the Secret.
  transcriptionServiceUrl: "http://munshi-platform-transcription-gateway.munshi-staging.svc.cluster.local:8084/v1/audio/transcriptions"
agentApi:
  replicaCount: 1
  workspaces:
    size: 2Gi

terminal:
  replicaCount: 1
  # Served at the staging dashboard hostname (caddy swap). NEXTAUTH_URL/TERMINAL_URL must match the
  # external https origin for cookie security + login redirects.
  publicUrl: ""

# LKE block storage (default SC is linode-block-storage-retain; leave SC unset to use it).
postgres:
  persistence:
    size: 5Gi
redis:
  persistence:
    size: 2Gi

# Recordings: Linode Object Storage, the store hosted production uses. The chart runs no object store.
storage:
  s3:
    endpoint: "https://us-sea-1.linodeobjects.com"
    bucket: "munshi-v012-staging-recordings"
    existingSecret: "munshi-v012-s3"

ingress:
  enabled: false               # reach via port-forward for the first proof; add ingress/LB next

# Single replica ⇒ no PDBs.
podDisruptionBudgets:
  gateway:
    enabled: false
  adminApi:
    enabled: false
  meetingApi:
    enabled: false
  runtime:
    enabled: false
  agentApi:
    enabled: false
