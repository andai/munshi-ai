# TEST-ONLY mail catcher for the staging witness: Mailpit (MIT) receives every mail the andai
# services and Alertmanager send (SMTP on mailpit:1025, no auth, no TLS) and relays nothing.
# Its UI and API (mailpit:8025) stay ClusterIP; reach them with kubectl port-forward.
#
#   kubectl -n munshi apply -f deploy/helm/tests/staging/mailpit.yaml
#
# values-staging-local.yaml points andai.smtp at it. Never a real relay; never shipped.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: munshi-staging-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: munshi-staging-test
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.32.0
          imagePullPolicy: IfNotPresent
          args: ["--smtp", "0.0.0.0:1025", "--listen", "0.0.0.0:8025", "--smtp-auth-accept-any",
                 "--smtp-auth-allow-insecure", "--disable-version-check"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: munshi-staging-test
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
